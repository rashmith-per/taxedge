spring:
  application:
    name: taxedge-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  flyway:
    enabled: true
    locations: classpath:db/migration

sandbox:
  base-url: ${SANDBOX_BASE_URL:https://test-api.sandbox.co.in}
  api-key: ${SANDBOX_API_KEY}
  api-secret: ${SANDBOX_API_SECRET}
  api-version: ${SANDBOX_API_VERSION:1.0}

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  api-key: ${TWILIO_API_KEY:}
  api-secret: ${TWILIO_API_SECRET:}
  verify-service-sid: ${TWILIO_VERIFY_SERVICE_SID:}

otp:
  test-mode:
    enabled: ${OTP_TEST_MODE_ENABLED:false}
    numbers: ${OTP_TEST_NUMBERS:}
    default-code: ${OTP_DEFAULT_CODE:123456}


server:
  port: ${SERVER_PORT:8086}

  error:
    include-message: always


jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

chat:
  encryption:
    secret: ${CHAT_ENCRYPTION_SECRET:${JWT_SECRET}}


taxedge:
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:no-reply@taxedge.com}}
    from-name: ${MAIL_FROM_NAME:TaxEdge}


# ===============================
# ACTUATOR
# ===============================

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always
      show-components: always

    prometheus:
      enabled: true

  metrics:
    tags:
      application: ${spring.application.name}


logging:
  level:
    com.taxedge: DEBUG